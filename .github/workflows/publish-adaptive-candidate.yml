name: Publish Adaptive Candidate APK

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Download existing APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10559966113/zip > candidate.zip
          mkdir candidate
          unzip -q candidate.zip -d candidate
          test -s candidate/FlClash-Adaptive-Candidate-0.8.98-a1-arm64.apk

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create adaptive-candidate-b3a7587 \
            candidate/FlClash-Adaptive-Candidate-0.8.98-a1-arm64.apk \
            --repo "${{ github.repository }}" \
            --target b3a7587930b54e18e693e6a41bd7e22406b527b0 \
            --title "FlClash Adaptive Candidate b3a7587" \
            --notes "Android arm64 Adaptive Candidate test build." \
            --prerelease
