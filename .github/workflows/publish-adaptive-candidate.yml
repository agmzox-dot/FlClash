name: Publish Adaptive Candidate APK

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build FlClash Adaptive Android Candidate workflow run ID
        required: true
        type: string
      source_sha:
        description: Commit SHA produced by that workflow run
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Download candidate artifact from the selected run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name FlClash-Adaptive-Candidate-0.8.98-a1-arm64 \
            --dir candidate
          test -s candidate/FlClash-Adaptive-Candidate-0.8.98-a1-arm64.apk
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Publish selected candidate to a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${SOURCE_SHA:0:12}"
          tag="adaptive-candidate-$short_sha"
          gh release create "$tag" \
            candidate/FlClash-Adaptive-Candidate-0.8.98-a1-arm64.apk \
            --repo "${{ github.repository }}" \
            --target "$SOURCE_SHA" \
            --title "FlClash Adaptive Candidate $short_sha" \
            --notes "Manually selected Android arm64 Adaptive Candidate build." \
            --prerelease
