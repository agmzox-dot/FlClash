name: Build FlClash Adaptive Android Candidate
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/adaptive-android-fix
permissions:
  contents: read
env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.26.4'
  NDK_VERSION: 'r28c'
  CANDIDATE_PACKAGE: com.follow.clash.adaptive.candidate
jobs:
  candidate_build:
    name: Android Adaptive candidate build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Verify committed Adaptive sources
        shell: bash
        run: |
          set -euo pipefail
          test -s core/adaptive/engine.go
          test -s core/adaptive/engine_test.go
          test -s core/adaptive_android.go
          test -s core/adaptive_other.go
          test -s android/core/src/main/cpp/core.cpp
          test -s android/service/src/main/java/com/follow/clash/service/modules/NetworkObserveModule.kt
          test ! -e .adaptive/patch_v0_8_98.py
          echo "Adaptive implementation is checked out as normal source."
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze and test Dart layer
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart
          flutter analyze --no-fatal-infos
          cp pubspec.yaml /tmp/pubspec.adaptive.yaml
          trap 'cp /tmp/pubspec.adaptive.yaml pubspec.yaml' EXIT
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          flutter pub get
          suites=()
          for entry in test/*; do
            if [ -d "$entry" ]; then
              if find "$entry" -type f -name '*_test.dart' -print -quit | grep -q .; then
                suites+=("$entry")
              fi
            elif [[ "$entry" == *_test.dart ]]; then
              suites+=("$entry")
            fi
          done
          for suite in "${suites[@]}"; do
            echo "::group::Dart suite $suite"
            if ! timeout --signal=TERM 180s flutter test "$suite" --reporter expanded; then
              echo "::error file=$suite,title=Dart suite failed::The suite failed or timed out"
              exit 1
            fi
            echo "::endgroup::"
          done
      - name: Format and test Go Adaptive engine
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          format_targets=(./*.go ./adaptive ./platform ./tun ./Clash.Meta/tunnel/tunnel.go ./Clash.Meta/tunnel/statistic)
          test -z "$(gofmt -l "${format_targets[@]}")" || {
            gofmt -l "${format_targets[@]}" >&2
            exit 1
          }
          CGO_ENABLED=0 go test -count=1 ./adaptive
          CGO_ENABLED=1 go test -race -count=1 ./adaptive
          CGO_ENABLED=0 go test -count=1 .
          CGO_ENABLED=0 go test -count=1 github.com/metacubex/mihomo/tunnel/statistic
          CGO_ENABLED=0 go vet .
          CGO_ENABLED=0 go vet github.com/metacubex/mihomo/tunnel/statistic
          CGO_ENABLED=0 GOOS=linux go vet ./platform
      - name: Validate Android CGO core
        working-directory: core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        shell: bash
        run: |
          set -euo pipefail
          CC="$(echo "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/aarch64-linux-android21-clang)"
          test -x "$CC" || { echo "NDK clang not found at $CC" >&2; exit 1; }
          tags="$(sed -n 's/^tags: *//p' ../build_config.yaml)"
          test -n "$tags" || { echo 'Could not read tags from build_config.yaml' >&2; exit 1; }
          export CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC
          go vet "-tags=$tags" . ./adaptive ./tun ./platform
      - name: Prepare Android local properties
        shell: bash
        run: |
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > android/local.properties
      - name: Android JVM unit tests
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." .
          chmod +x gradlew
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest \
            -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug
      - name: Build arm64 Adaptive Candidate APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --env stable --targets apk --arch arm64 -v
      - name: Preserve arm64 candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p adaptive-artifact
          apk="$(find dist -type f -name '*android-arm64-v8a*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo 'arm64 APK was not produced' >&2
            find dist -type f -name '*.apk' -print >&2 || true
            exit 1
          fi
          test -n "$apk" && test -f "$apk"
          cp "$apk" adaptive-artifact/FlClash-Adaptive-Candidate-0.8.98-a1-arm64.apk
          cat > adaptive-artifact/BUILD_INFO.txt <<'EOF'
          FlClash Adaptive Candidate
          Source is the committed Adaptive implementation on the triggering branch.
          Android package: com.follow.clash.adaptive.candidate
          This candidate intentionally does not replace official FlClash.
          No real nodes, subscriptions, or VPS credentials are used by CI.
          EOF
      - name: Build x86_64 emulator APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --env stable --targets apk --arch amd64 -v
      - name: Prepare emulator APK inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p emulator-inputs
          apk="$(find dist -type f -name '*android-x86_64*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo 'x86_64 emulator APK was not produced' >&2
            find dist -type f -name '*.apk' -print >&2 || true
            exit 1
          fi
          cp "$apk" emulator-inputs/FlClash-Adaptive-Candidate-0.8.98-a1-android-x86_64.apk
          cp adaptive-artifact/FlClash-Adaptive-Candidate-0.8.98-a1-arm64.apk emulator-inputs/
      - name: Upload emulator APK inputs
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Adaptive-emulator-inputs
          path: emulator-inputs/
          if-no-files-found: error
          retention-days: 1
      - name: Finalize arm64 artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd adaptive-artifact && sha256sum *.apk BUILD_INFO.txt > SHA256SUMS)
          cat adaptive-artifact/SHA256SUMS
      - name: Upload private candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Adaptive-Candidate-0.8.98-a1-arm64
          path: adaptive-artifact/
          if-no-files-found: error
          retention-days: 14

  emulator_acceptance:
    name: Android Adaptive emulator acceptance
    needs: candidate_build
    if: ${{ needs.candidate_build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Download emulator APK inputs
        uses: actions/download-artifact@v4
        with:
          name: FlClash-Adaptive-emulator-inputs
          path: emulator-inputs
      - name: Prepare emulator APK inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist adaptive-artifact
          x86_apk='emulator-inputs/FlClash-Adaptive-Candidate-0.8.98-a1-android-x86_64.apk'
          arm64_apk='emulator-inputs/FlClash-Adaptive-Candidate-0.8.98-a1-arm64.apk'
          test -s "$x86_apk" || { echo "Missing x86_64 emulator APK: $x86_apk" >&2; exit 1; }
          test -s "$arm64_apk" || { echo "Missing arm64 Candidate APK: $arm64_apk" >&2; exit 1; }
          cp "$x86_apk" dist/
          cp "$arm64_apk" adaptive-artifact/
      - name: Initialize emulator diagnostics
        if: always()
        shell: bash
        run: |
          set -u
          : > "$GITHUB_WORKSPACE/emulator.log"
          : > "$GITHUB_WORKSPACE/emulator-error.log"
          : > "$GITHUB_WORKSPACE/emulator-ui.xml"
          : > "$GITHUB_WORKSPACE/emulator-services.txt"
          : > "$GITHUB_WORKSPACE/emulator-signature.txt"
          : > "$GITHUB_WORKSPACE/emulator-acceptance.txt"
          : > "$GITHUB_WORKSPACE/emulator-runner.log"
          : > "$GITHUB_WORKSPACE/emulator-runner-error.log"
          : > "$GITHUB_WORKSPACE/kvm-check.log"
          : > "$GITHUB_WORKSPACE/emulator-accel-check.log"
          : > "$GITHUB_WORKSPACE/emulator-environment-error.log"
          printf '%s\n' 'emulator validation diagnostics initialized' > "$GITHUB_WORKSPACE/emulator-error.log"
      - name: Enable KVM group permissions
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify KVM and emulator hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          fail() {
            printf '%s\n' "$1" | tee -a "$GITHUB_WORKSPACE/emulator-environment-error.log" >&2
            printf '::error title=Android emulator environment blocked::%s\n' "$1"
            exit 1
          }
          if [[ ! -e /dev/kvm ]]; then
            fail '/dev/kvm is missing; refusing to start a software-emulated Android test device'
          fi
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            ls -l /dev/kvm | tee -a "$GITHUB_WORKSPACE/emulator-environment-error.log" || true
            fail "$(id -un) cannot read and write /dev/kvm"
          fi
          {
            printf 'user: %s\n' "$(id -un)"
            printf 'groups: %s\n' "$(id -Gn)"
            printf 'kvm: '
            ls -l /dev/kvm
            printf '\nreadable: %s\nwritable: %s\n' "$([[ -r /dev/kvm ]] && echo yes || echo no)" "$([[ -w /dev/kvm ]] && echo yes || echo no)"
          } | tee "$GITHUB_WORKSPACE/kvm-check.log"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          emulator_bin="$(command -v emulator || true)"
          if [[ -z "$emulator_bin" && -n "$sdk_root" ]]; then
            emulator_bin="$sdk_root/emulator/emulator"
          fi
          [[ -x "$emulator_bin" ]] || fail "Android emulator binary is unavailable at $emulator_bin"
          if ! "$emulator_bin" -accel-check 2>&1 | tee "$GITHUB_WORKSPACE/emulator-accel-check.log"; then
            fail 'Android emulator -accel-check failed; refusing to start without hardware acceleration'
          fi
          if ! grep -Eiq 'KVM.*(installed and )?usable|KVM.*usable' "$GITHUB_WORKSPACE/emulator-accel-check.log"; then
            fail 'Android emulator -accel-check did not report usable KVM acceleration'
          fi
          printf '%s\n' 'KVM is present, accessible by the current user, and reported usable by the Android emulator.'
      - name: Android emulator launch validation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -accel on -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          # The action executes each script line separately; keep this as one command.
          script: timeout --signal=TERM --kill-after=30s 60m bash "$GITHUB_WORKSPACE/.github/scripts/adaptive-emulator-smoke.sh"
      - name: Capture emulator diagnostics
        if: always()
        shell: bash
        run: |
          set -u
          runner_log="$GITHUB_WORKSPACE/emulator-runner.log"
          runner_error="$GITHUB_WORKSPACE/emulator-runner-error.log"
          : > "$runner_log"
          : > "$runner_error"
          if command -v adb >/dev/null 2>&1; then
            adb devices -l >> "$runner_error" 2>&1 || true
            timeout --signal=TERM --kill-after=5s 30s adb logcat -b all -d -v threadtime > "$runner_log" 2>> "$runner_error" || true
            {
              printf '\n--- runner diagnostic package ---\n'
              timeout --signal=TERM --kill-after=5s 30s adb shell dumpsys package "$CANDIDATE_PACKAGE" || true
              printf '\n--- runner diagnostic activity ---\n'
              timeout --signal=TERM --kill-after=5s 30s adb shell dumpsys activity activities || true
            } >> "$runner_error" 2>&1
          else
            printf '%s\n' 'adb was not available after emulator-runner returned' >> "$runner_error"
          fi
      - name: Publish emulator acceptance summary
        if: always()
        shell: bash
        run: |
          set -u
          {
            printf '%s\n' '## Android emulator acceptance'
            printf '%s\n' '' '### Emulator environment'
            if [[ -s "$GITHUB_WORKSPACE/emulator-environment-error.log" ]]; then
              cat "$GITHUB_WORKSPACE/emulator-environment-error.log"
            else
              printf '%s\n' 'No KVM environment error was recorded.'
            fi
            printf '%s\n' '' '### KVM check'
            sed -n '1,120p' "$GITHUB_WORKSPACE/kvm-check.log" 2>/dev/null || true
            printf '%s\n' '' '### Emulator acceleration check'
            sed -n '1,120p' "$GITHUB_WORKSPACE/emulator-accel-check.log" 2>/dev/null || true
            printf '%s\n' '' '### Acceptance records'
            if [[ -s "$GITHUB_WORKSPACE/emulator-acceptance.txt" ]]; then
              sed -n '1,240p' "$GITHUB_WORKSPACE/emulator-acceptance.txt"
            else
              printf '%s\n' 'No acceptance records were produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish emulator acceptance notices
        if: always()
        shell: bash
        run: |
          set -u
          acceptance_file="$GITHUB_WORKSPACE/emulator-acceptance.txt"
          if [[ -s "$acceptance_file" ]]; then
            while IFS= read -r line; do
              case "$line" in
                PHASE:*|PASS:*|FAIL:*|UNVERIFIED:*)
                  printf '::notice title=Android emulator acceptance::%s\n' "$line"
                  ;;
              esac
            done < "$acceptance_file"
          else
            printf '%s\n' '::notice title=Android emulator acceptance::No acceptance records were produced.'
          fi
      - name: Upload emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Adaptive-emulator-log
          path: |
            emulator.log
            emulator-error.log
            emulator-ui.xml
            emulator-services.txt
            emulator-signature.txt
            emulator-acceptance.txt
            adb-install-attempt-*.log
            emulator-runner.log
            emulator-runner-error.log
            kvm-check.log
            emulator-accel-check.log
            emulator-environment-error.log
          if-no-files-found: warn
          retention-days: 14
