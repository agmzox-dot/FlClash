name: Build FlClash Adaptive Android Candidate
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/adaptive-android-fix
permissions:
  contents: read
env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.26.4'
  NDK_VERSION: 'r28c'
  CANDIDATE_PACKAGE: com.follow.clash.adaptive.candidate
jobs:
  candidate:
    name: Android Adaptive candidate and emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout source with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Verify committed Adaptive sources
        shell: bash
        run: |
          set -euo pipefail
          test -s core/adaptive/engine.go
          test -s core/adaptive/engine_test.go
          test -s core/adaptive_android.go
          test -s core/adaptive_other.go
          test -s android/core/src/main/cpp/core.cpp
          test -s android/service/src/main/java/com/follow/clash/service/modules/NetworkObserveModule.kt
          test ! -e .adaptive/patch_v0_8_98.py
          echo "Adaptive implementation is checked out as normal source."
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze and test Dart layer
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart
          flutter analyze --no-fatal-infos
          cp pubspec.yaml /tmp/pubspec.adaptive.yaml
          trap 'cp /tmp/pubspec.adaptive.yaml pubspec.yaml' EXIT
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          flutter pub get
          suites=()
          for entry in test/*; do
            if [ -d "$entry" ]; then
              if find "$entry" -type f -name '*_test.dart' -print -quit | grep -q .; then
                suites+=("$entry")
              fi
            elif [[ "$entry" == *_test.dart ]]; then
              suites+=("$entry")
            fi
          done
          for suite in "${suites[@]}"; do
            echo "::group::Dart suite $suite"
            if ! timeout --signal=TERM 180s flutter test "$suite" --reporter expanded; then
              echo "::error file=$suite,title=Dart suite failed::The suite failed or timed out"
              exit 1
            fi
            echo "::endgroup::"
          done
      - name: Format and test Go Adaptive engine
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          format_targets=(./*.go ./adaptive ./platform ./tun ./Clash.Meta/tunnel/tunnel.go ./Clash.Meta/tunnel/statistic)
          test -z "$(gofmt -l "${format_targets[@]}")" || {
            gofmt -l "${format_targets[@]}" >&2
            exit 1
          }
          CGO_ENABLED=0 go test -count=1 ./adaptive
          CGO_ENABLED=1 go test -race -count=1 ./adaptive
          CGO_ENABLED=0 go test -count=1 .
          CGO_ENABLED=0 go test -count=1 github.com/metacubex/mihomo/tunnel/statistic
          CGO_ENABLED=0 go vet .
          CGO_ENABLED=0 go vet github.com/metacubex/mihomo/tunnel/statistic
          CGO_ENABLED=0 GOOS=linux go vet ./platform
      - name: Validate Android CGO core
        working-directory: core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        shell: bash
        run: |
          set -euo pipefail
          CC="$(echo "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/aarch64-linux-android21-clang)"
          test -x "$CC" || { echo "NDK clang not found at $CC" >&2; exit 1; }
          tags="$(sed -n 's/^tags: *//p' ../build_config.yaml)"
          test -n "$tags" || { echo 'Could not read tags from build_config.yaml' >&2; exit 1; }
          export CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC
          go vet "-tags=$tags" . ./adaptive ./tun ./platform
      - name: Prepare Android local properties
        shell: bash
        run: |
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > android/local.properties
      - name: Android JVM unit tests
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." .
          chmod +x gradlew
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest \
            -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug
      - name: Build arm64 Adaptive Candidate APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --env stable --targets apk --arch arm64 -v
      - name: Preserve arm64 candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p adaptive-artifact
          apk="$(find dist -type f -name '*.apk' | head -n 1)"
          test -n "$apk" && test -f "$apk"
          cp "$apk" adaptive-artifact/FlClash-Adaptive-Candidate-0.8.98-a1-arm64.apk
          cat > adaptive-artifact/BUILD_INFO.txt <<'EOF'
          FlClash Adaptive Candidate
          Source is the committed Adaptive implementation on the triggering branch.
          Android package: com.follow.clash.adaptive.candidate
          This candidate intentionally does not replace official FlClash.
          No real nodes, subscriptions, or VPS credentials are used by CI.
          EOF
      - name: Build x86_64 emulator APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --env stable --targets apk --arch amd64 -v
      - name: Android emulator launch validation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            apk="$(find dist -type f -name '*.apk' -printf '%T@ %p\\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
            test -n "$apk" && test -f "$apk"
            adb wait-for-device
            adb install -r "$apk"
            adb logcat -c
            adb shell monkey -p "$CANDIDATE_PACKAGE" -c android.intent.category.LAUNCHER 1
            for attempt in $(seq 1 30); do
              if adb shell pidof "$CANDIDATE_PACKAGE" | tr -d '\\r' | grep -q '[0-9]'; then
                break
              fi
              sleep 1
            done
            pid="$(adb shell pidof "$CANDIDATE_PACKAGE" | tr -d '\\r')"
            test -n "$pid"
            sleep 15
            adb logcat -d -v time > emulator.log
            if grep -Eq 'FATAL EXCEPTION|Fatal signal|SIGSEGV|UnsatisfiedLinkError' emulator.log; then
              grep -E -C 3 'FATAL EXCEPTION|Fatal signal|SIGSEGV|UnsatisfiedLinkError' emulator.log || true
              exit 1
            fi
            test -n "$(adb shell pidof "$CANDIDATE_PACKAGE" | tr -d '\\r')"
      - name: Upload emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Adaptive-emulator-log
          path: emulator.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Finalize arm64 artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd adaptive-artifact && sha256sum *.apk BUILD_INFO.txt > SHA256SUMS)
          cat adaptive-artifact/SHA256SUMS
      - name: Upload private candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Adaptive-Candidate-0.8.98-a1-arm64
          path: adaptive-artifact/
          if-no-files-found: error
          retention-days: 14
