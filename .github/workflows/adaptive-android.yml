name: Build FlClash Adaptive Android Candidate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/adaptive-android.yml'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.26.4'
  NDK_VERSION: 'r28c'

jobs:
  candidate:
    name: Android arm64 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout pinned fork with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Materialize audited Adaptive payload
        shell: bash
        run: |
          mkdir -p .adaptive vps
          python3 - <<'PY'
          import base64, pathlib, zlib
          patch = ""
          vps = ""
          pathlib.Path('.adaptive/patch_v0_8_98.py').write_bytes(zlib.decompress(base64.b64decode(patch)))
          pathlib.Path('vps/install_mobile_24445.sh').write_bytes(zlib.decompress(base64.b64decode(vps)))
          PY
          chmod 0755 .adaptive/patch_v0_8_98.py vps/install_mobile_24445.sh
          python3 -m py_compile .adaptive/patch_v0_8_98.py
          bash -n vps/install_mobile_24445.sh
          test "$(sha256sum .adaptive/patch_v0_8_98.py | awk '{print $1}')" = "363f1846c47f2a8272719767e7c483cb9479498749b2f5b5bf6eb05caf8bc9f9"
          test "$(sha256sum vps/install_mobile_24445.sh | awk '{print $1}')" = "0c949ebcc00b0c6714ac50f74d6041932d9e29e0391ebd8e5f14e4b5af683655"

      - name: Apply fail-closed Adaptive patch
        run: python3 .adaptive/patch_v0_8_98.py

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze and test Dart layer
        shell: bash
        run: |
          dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart
          flutter analyze --no-fatal-infos
          cp pubspec.yaml /tmp/pubspec.adaptive.yaml
          trap 'cp /tmp/pubspec.adaptive.yaml pubspec.yaml' EXIT
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          flutter pub get
          sed -i "s/const appName = 'FlClash Adaptive Candidate';/const appName = 'FlClash';/" lib/common/constant.dart
          flutter test --reporter expanded
          cp /tmp/pubspec.adaptive.yaml pubspec.yaml
          trap - EXIT
          flutter pub get

      - name: Format and test Go Adaptive engine
        working-directory: core
        run: |
          format_targets=(./*.go ./adaptive ./platform ./tun ./Clash.Meta/tunnel/tunnel.go ./Clash.Meta/tunnel/statistic)
          test -z "$(gofmt -l "${format_targets[@]}")" || {
            gofmt -l "${format_targets[@]}" >&2
            exit 1
          }
          CGO_ENABLED=0 go test -count=1 ./adaptive
          CGO_ENABLED=1 go test -race -count=1 ./adaptive
          CGO_ENABLED=0 go test -count=1 .
          CGO_ENABLED=0 go test -count=1 github.com/metacubex/mihomo/tunnel/statistic
          CGO_ENABLED=0 go vet .
          CGO_ENABLED=0 go vet github.com/metacubex/mihomo/tunnel/statistic
          CGO_ENABLED=0 GOOS=linux go vet ./platform

      - name: Validate Android CGO core
        working-directory: core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          CC="$(echo "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/aarch64-linux-android21-clang)"
          test -x "$CC" || { echo "NDK clang not found at $CC" >&2; exit 1; }
          tags="$(sed -n 's/^tags: *//p' ../build_config.yaml)"
          test -n "$tags" || { echo 'Could not read tags from build_config.yaml' >&2; exit 1; }
          export CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC
          go vet "-tags=$tags" . ./adaptive ./tun ./platform

      - name: Prepare Android local properties
        run: |
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > android/local.properties

      - name: Android JVM unit tests
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." .
          chmod +x gradlew
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest \
            -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug

      - name: Check patch diff
        run: |
          git diff --check
          git diff --stat

      - name: Build arm64 Adaptive Candidate APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --env stable --targets apk --arch arm64 -v

      - name: Normalize candidate artifact
        shell: bash
        run: |
          mkdir -p adaptive-artifact
          apk="$(find dist -type f -name '*.apk' | head -n 1)"
          test -n "$apk" && test -f "$apk" || { echo 'No APK produced' >&2; exit 1; }
          cp "$apk" adaptive-artifact/FlClash-Adaptive-Candidate-0.8.98-a1-arm64.apk
          cp vps/install_mobile_24445.sh adaptive-artifact/install_mobile_24445.sh
          cat > adaptive-artifact/BUILD_INFO.txt <<'EOF'
          FlClash Adaptive Candidate v0.1
          Upstream FlClash: v0.8.98 / 7c61c90ac20493b474d19c75ec96262b478b4b88
          Mihomo: 70f0570405c3c2c47bb113b88db95006d239b346
          Android package: com.follow.clash.adaptive.candidate
          This candidate intentionally does not replace official FlClash or any future Stable Adaptive package.
          Adaptive traffic accounting is wired to Mihomo TCP tracker byte/close hooks; no /connections polling is used.
          EOF
          (cd adaptive-artifact && sha256sum FlClash-Adaptive-Candidate-0.8.98-a1-arm64.apk install_mobile_24445.sh BUILD_INFO.txt > SHA256SUMS)
          cat adaptive-artifact/SHA256SUMS

      - name: Upload private candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Adaptive-Candidate-0.8.98-a1-arm64
          path: adaptive-artifact/
          if-no-files-found: error
          retention-days: 14
