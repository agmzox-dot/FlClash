name: Build FlClash Adaptive Android Candidate
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/adaptive-android-fix
permissions:
  contents: read
env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.26.4'
  NDK_VERSION: 'r28c'
  CANDIDATE_PACKAGE: com.follow.clash.adaptive.candidate
jobs:
  candidate:
    name: Android Adaptive candidate and emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout source with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Verify committed Adaptive sources
        shell: bash
        run: |
          set -euo pipefail
          test -s core/adaptive/engine.go
          test -s core/adaptive/engine_test.go
          test -s core/adaptive_android.go
          test -s core/adaptive_other.go
          test -s android/core/src/main/cpp/core.cpp
          test -s android/service/src/main/java/com/follow/clash/service/modules/NetworkObserveModule.kt
          test ! -e .adaptive/patch_v0_8_98.py
          echo "Adaptive implementation is checked out as normal source."
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze and test Dart layer
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart
          flutter analyze --no-fatal-infos
          cp pubspec.yaml /tmp/pubspec.adaptive.yaml
          trap 'cp /tmp/pubspec.adaptive.yaml pubspec.yaml' EXIT
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          flutter pub get
          suites=()
          for entry in test/*; do
            if [ -d "$entry" ]; then
              if find "$entry" -type f -name '*_test.dart' -print -quit | grep -q .; then
                suites+=("$entry")
              fi
            elif [[ "$entry" == *_test.dart ]]; then
              suites+=("$entry")
            fi
          done
          for suite in "${suites[@]}"; do
            echo "::group::Dart suite $suite"
            if ! timeout --signal=TERM 180s flutter test "$suite" --reporter expanded; then
              echo "::error file=$suite,title=Dart suite failed::The suite failed or timed out"
              exit 1
            fi
            echo "::endgroup::"
          done
      - name: Format and test Go Adaptive engine
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          format_targets=(./*.go ./adaptive ./platform ./tun ./Clash.Meta/tunnel/tunnel.go ./Clash.Meta/tunnel/statistic)
          test -z "$(gofmt -l "${format_targets[@]}")" || {
            gofmt -l "${format_targets[@]}" >&2
            exit 1
          }
          CGO_ENABLED=0 go test -count=1 ./adaptive
          CGO_ENABLED=1 go test -race -count=1 ./adaptive
          CGO_ENABLED=0 go test -count=1 .
          CGO_ENABLED=0 go test -count=1 github.com/metacubex/mihomo/tunnel/statistic
          CGO_ENABLED=0 go vet .
          CGO_ENABLED=0 go vet github.com/metacubex/mihomo/tunnel/statistic
          CGO_ENABLED=0 GOOS=linux go vet ./platform
      - name: Validate Android CGO core
        working-directory: core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        shell: bash
        run: |
          set -euo pipefail
          CC="$(echo "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/aarch64-linux-android21-clang)"
          test -x "$CC" || { echo "NDK clang not found at $CC" >&2; exit 1; }
          tags="$(sed -n 's/^tags: *//p' ../build_config.yaml)"
          test -n "$tags" || { echo 'Could not read tags from build_config.yaml' >&2; exit 1; }
          export CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC
          go vet "-tags=$tags" . ./adaptive ./tun ./platform
      - name: Prepare Android local properties
        shell: bash
        run: |
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > android/local.properties
      - name: Android JVM unit tests
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." .
          chmod +x gradlew
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest \
            -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug
      - name: Build arm64 Adaptive Candidate APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --env stable --targets apk --arch arm64 -v
      - name: Preserve arm64 candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p adaptive-artifact
          apk="$(find dist -type f -name '*android-arm64-v8a*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo 'arm64 APK was not produced' >&2
            find dist -type f -name '*.apk' -print >&2 || true
            exit 1
          fi
          test -n "$apk" && test -f "$apk"
          cp "$apk" adaptive-artifact/FlClash-Adaptive-Candidate-0.8.98-a1-arm64.apk
          cat > adaptive-artifact/BUILD_INFO.txt <<'EOF'
          FlClash Adaptive Candidate
          Source is the committed Adaptive implementation on the triggering branch.
          Android package: com.follow.clash.adaptive.candidate
          This candidate intentionally does not replace official FlClash.
          No real nodes, subscriptions, or VPS credentials are used by CI.
          EOF
      - name: Build x86_64 emulator APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --env stable --targets apk --arch amd64 -v
      - name: Android emulator launch validation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            apk="$(find dist -type f -name '*android-x86_64*.apk' -print -quit)"
            log_file="$GITHUB_WORKSPACE/emulator.log"
            error_file="$GITHUB_WORKSPACE/emulator-error.log"
            : > "$log_file"
            : > "$error_file"

            record_error() {
              printf '%s\n' "$*" >> "$error_file"
              printf '%s\n' "$*" >&2
            }

            dump_diagnostics() {
              status=$?
              if command -v adb >/dev/null 2>&1; then
                adb logcat -b all -d -v threadtime > "$log_file" 2>> "$error_file" || true
                {
                  printf '\n--- emulator script exit: %s ---\n' "$status"
                  printf '\n--- process ---\n'
                  adb shell pidof "$CANDIDATE_PACKAGE" || true
                  printf '\n--- package ---\n'
                  adb shell dumpsys package "$CANDIDATE_PACKAGE" || true
                  printf '\n--- activity ---\n'
                  adb shell dumpsys activity activities || true
                } >> "$error_file" 2>&1
              else
                record_error 'adb was not available while collecting diagnostics'
              fi
              return "$status"
            }
            trap dump_diagnostics EXIT

            if [ -z "$apk" ] || [ ! -f "$apk" ]; then
              record_error 'x86_64 emulator APK was not produced'
              find dist -type f -name '*.apk' -print >> "$error_file" 2>&1 || true
              exit 1
            fi
            if ! unzip -Z1 "$apk" | grep -q '^lib/x86_64/'; then
              record_error "selected APK does not contain x86_64 native libraries: $apk"
              exit 1
            fi
            if unzip -Z1 "$apk" | grep -q '^lib/arm64-v8a/'; then
              record_error "selected APK contains arm64 native libraries: $apk"
              exit 1
            fi

            device_state=''
            for attempt in $(seq 1 90); do
              device_state="$(adb get-state 2>> "$error_file" || true)"
              if [ "$device_state" = 'device' ]; then
                break
              fi
              sleep 2
            done
            if [ "$device_state" != 'device' ]; then
              record_error "emulator did not become ready: $device_state"
              exit 1
            fi

            boot_completed=''
            for attempt in $(seq 1 90); do
              boot_completed="$(adb shell getprop sys.boot_completed 2>> "$error_file" | tr -d '\r' || true)"
              if [ "$boot_completed" = '1' ]; then
                break
              fi
              sleep 2
            done
            if [ "$boot_completed" != '1' ]; then
              record_error "emulator boot did not complete: $boot_completed"
              exit 1
            fi

            if ! adb install -r "$apk" >> "$error_file" 2>&1; then
              record_error "failed to install x86_64 APK: $apk"
              exit 1
            fi
            if ! adb logcat -c >> "$error_file" 2>&1; then
              record_error 'failed to clear logcat before launch'
              exit 1
            fi
            if ! adb shell monkey -p "$CANDIDATE_PACKAGE" -c android.intent.category.LAUNCHER 1 >> "$error_file" 2>&1; then
              record_error "failed to launch $CANDIDATE_PACKAGE"
              exit 1
            fi

            pid=''
            for attempt in $(seq 1 60); do
              pid="$(adb shell pidof "$CANDIDATE_PACKAGE" 2>> "$error_file" | tr -d '\r' || true)"
              case "$pid" in
                *[0-9]*) break ;;
              esac
              sleep 2
            done
            case "$pid" in
              *[0-9]*) ;;
              *)
                record_error "application process did not start: $CANDIDATE_PACKAGE"
                exit 1
                ;;
            esac

            sleep 20
            final_pid="$(adb shell pidof "$CANDIDATE_PACKAGE" 2>> "$error_file" | tr -d '\r' || true)"
            case "$final_pid" in
              *[0-9]*) ;;
              *)
                record_error "application process exited after launch: $CANDIDATE_PACKAGE"
                exit 1
                ;;
            esac

            if ! adb logcat -b all --pid="$final_pid" -d -v threadtime > "$log_file" 2>> "$error_file"; then
              record_error 'pid-filtered logcat failed; capturing all logcat buffers'
              adb logcat -b all -d -v threadtime > "$log_file" 2>> "$error_file" || true
            fi
            if grep -Eq 'FATAL EXCEPTION|Fatal signal|SIGSEGV|UnsatisfiedLinkError|ANR in' "$log_file"; then
              grep -E -C 3 'FATAL EXCEPTION|Fatal signal|SIGSEGV|UnsatisfiedLinkError|ANR in' "$log_file" || true
              record_error "application reported a fatal startup condition: $CANDIDATE_PACKAGE"
              exit 1
            fi
      - name: Capture emulator diagnostics
        if: always()
        shell: bash
        run: |
          set -u
          runner_log="$GITHUB_WORKSPACE/emulator-runner.log"
          runner_error="$GITHUB_WORKSPACE/emulator-runner-error.log"
          : > "$runner_log"
          : > "$runner_error"
          if command -v adb >/dev/null 2>&1; then
            adb devices -l >> "$runner_error" 2>&1 || true
            timeout --signal=TERM 30s adb logcat -b all -d -v threadtime > "$runner_log" 2>> "$runner_error" || true
            {
              printf '\n--- runner diagnostic package ---\n'
              timeout --signal=TERM 30s adb shell dumpsys package "$CANDIDATE_PACKAGE" || true
              printf '\n--- runner diagnostic activity ---\n'
              timeout --signal=TERM 30s adb shell dumpsys activity activities || true
            } >> "$runner_error" 2>&1
          else
            printf '%s\n' 'adb was not available after emulator-runner returned' >> "$runner_error"
          fi
      - name: Upload emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Adaptive-emulator-log
          path: |
            emulator.log
            emulator-error.log
            emulator-runner.log
            emulator-runner-error.log
          if-no-files-found: warn
          retention-days: 14
      - name: Finalize arm64 artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd adaptive-artifact && sha256sum *.apk BUILD_INFO.txt > SHA256SUMS)
          cat adaptive-artifact/SHA256SUMS
      - name: Upload private candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Adaptive-Candidate-0.8.98-a1-arm64
          path: adaptive-artifact/
          if-no-files-found: error
          retention-days: 14
